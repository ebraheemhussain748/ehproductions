<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.googleusercontent.com https://images.unsplash.com; font-src 'self'; connect-src 'self' https://*.googleapis.com https://ehproductions-f0c49.firebaseapp.com; frame-src https://ehproductions-f0c49.firebaseapp.com https://accounts.google.com https://apis.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Studio admin | Ebraheem Hussain Productions</title>
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="stylesheet" href="css/styles.css?v=bd8f584e">
</head>
<body class="page-admin">
  <div class="adm__login" id="login">
    <img src="assets/img/logo-mark-96.png" alt="" width="62" height="32" style="margin:0 auto 18px;width:62px;border-radius:8px;background:#000">
    <h1>Studio admin</h1>
    <p class="small" id="login-text">Loading…</p>
    <button class="btn btn--dark" id="signin" hidden>Sign in with Google</button>
    <p style="margin-top:18px"><a class="small" href="./">Back to the website</a></p>
  </div>

  <div class="adm" id="app" hidden>
    <nav class="adm__side" aria-label="Admin sections">
      <a class="brand" href="./"><img src="assets/img/logo-mark-96.png" alt="" width="62" height="32"><span>Studio admin<small>Ebraheem Hussain Productions</small></span></a>
      <button type="button" data-view="dashboard"><span data-icon="grid"></span>Dashboard</button>
      <button type="button" data-view="leads"><span data-icon="chat"></span>Leads <span class="n" id="n-leads" hidden></span></button>
      <button type="button" data-view="reviews"><span data-icon="check"></span>Reviews <span class="n" id="n-reviews" hidden></span></button>
      <button type="button" data-view="prices"><span data-icon="list"></span>Prices</button>
      <button type="button" data-view="products"><span data-icon="plus"></span>Products</button>
      <button type="button" data-view="home"><span data-icon="window"></span>Home &amp; banner</button>
      <span class="spacer"></span>
      <a href="./" target="_blank" rel="noopener">View website ↗</a>
      <button type="button" id="signout"><span data-icon="close"></span>Sign out</button>
    </nav>
    <main class="adm__main">
      <div class="adm__top"><h1 id="view-title">Dashboard</h1><span class="adm__who" id="who"></span></div>
      <div id="view"></div>
    </main>
  </div>
  <p class="msg" id="msg" role="status"></p>
  <script type="module" src="js/admin.js?v=bd8f584e"></script>
</body>
</html>
